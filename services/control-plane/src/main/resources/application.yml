spring:
  application:
    name: control-plane
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/incident_response}
    username: ${DATABASE_USERNAME:incident_response}
    password: ${DATABASE_PASSWORD:local-development-only}
    hikari:
      maximum-pool-size: ${DATABASE_MAX_POOL_SIZE:10}
      minimum-idle: ${DATABASE_MIN_IDLE:2}
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    default-property-inclusion: non_null

server:
  port: ${CONTROL_PLANE_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,flyway
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

info:
  application:
    name: ${spring.application.name}
    description: AI-assisted CI/CD incident response control plane
    version: ${BUILD_VERSION:development}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  structured:
    format:
      console: logstash
  level:
    root: INFO
    com.samharrison.incidentresponse: INFO
application:
  authentication:
    issuer: ${AUTH_ISSUER:incident-response-control-plane}
    audience: ${AUTH_AUDIENCE:incident-response-web}
    signing-secret: ${AUTH_SIGNING_SECRET:local-development-signing-secret-change-me}
    access-token-ttl: ${AUTH_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${AUTH_REFRESH_TOKEN_TTL:P7D}
    refresh-cookie-name: ${AUTH_REFRESH_COOKIE_NAME:incident_refresh}
    secure-cookies: ${AUTH_SECURE_COOKIES:false}
    password-minimum-length: ${AUTH_PASSWORD_MINIMUM_LENGTH:12}
  webhooks:
    secrets:
      local-simulator: ${WEBHOOK_SECRET_LOCAL_SIMULATOR:}

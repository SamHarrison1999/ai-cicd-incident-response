name: ai-cicd-incident-response

services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-incident_response}
      POSTGRES_USER: ${POSTGRES_USER:-incident_response}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - incident-response-postgres-data:/var/lib/postgresql/data
    networks:
      - incident-response-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  control-plane:
    build:
      context: ./services/control-plane
      dockerfile: Dockerfile
    environment:
      CONTROL_PLANE_PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-incident_response}
      DATABASE_USERNAME: ${POSTGRES_USER:-incident_response}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      DATABASE_MAX_POOL_SIZE: ${DATABASE_MAX_POOL_SIZE:-10}
      DATABASE_MIN_IDLE: ${DATABASE_MIN_IDLE:-2}
      INTELLIGENCE_SERVICE_BASE_URL: http://intelligence-service:8000
      BUILD_VERSION: ${BUILD_VERSION:-local}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - incident-response-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://localhost:8080/actuator/health | grep '\"status\":\"UP\"' >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  intelligence-service:
    build:
      context: ./services/intelligence-service
      dockerfile: Dockerfile
    environment:
      INTELLIGENCE_ENVIRONMENT: local
      INTELLIGENCE_LOG_LEVEL: INFO
      INTELLIGENCE_PROVIDER: deterministic
      INTELLIGENCE_DETERMINISTIC_PROVIDER_VERSION: foundation-1
    networks:
      - incident-response-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://localhost:8000/health/ready | grep '\"status\":\"UP\"' >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    depends_on:
      control-plane:
        condition: service_healthy
      intelligence-service:
        condition: service_healthy
    networks:
      - incident-response-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --output-document=- http://localhost:8080/ >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

networks:
  incident-response-network:
    driver: bridge

volumes:
  incident-response-postgres-data:

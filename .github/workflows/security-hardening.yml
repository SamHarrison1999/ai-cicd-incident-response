name: Security hardening

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security-workspace:
    name: Security workspace
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate security workspace
        shell: pwsh
        run: ./scripts/verify-phase-13-security.ps1 -SkipDocker

      - name: Validate Docker Compose model
        run: docker compose config --quiet

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript, python]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Set up Java for CodeQL autobuild
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Autobuild compiled languages
        if: matrix.language == 'java-kotlin'
        uses: github/codeql-action/autobuild@v4

      - name: Analyse code
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
